# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Dependabot can't update mise tool versions:
# https://github.com/dependabot/dependabot-core/issues/12320
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
